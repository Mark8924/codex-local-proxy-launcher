name: Launcher tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native entry and scripts
        run: |
          clang -Wall -Wextra -Werror -fsyntax-only macos/native-launcher/main.c
          for script in macos/*.command macos/Codex\ Launcher.app/Contents/Resources/*.zsh; do
            zsh -n "$script"
          done
          plutil -lint "macos/Codex Launcher.app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "macos/Codex Launcher.app"
      - name: Run macOS regression tests
        run: python3 -m unittest discover -s tests -p 'test_macos.py' -v
      - name: Verify settings app
        run: |
          codesign --verify --deep --strict "macos/Codex Launcher Settings.app"
          swiftc -typecheck macos/settings/main.swift
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          "macos/Codex Launcher Settings.app/Contents/MacOS/Launcher Settings" --self-test "$temp"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows PowerShell 5.1 regression tests
        shell: powershell
        run: ./tests/windows.ps1
      - name: Run PowerShell 7 regression tests
        if: success() || failure()
        shell: pwsh
        run: ./tests/windows.ps1
      - name: Check Windows settings UI
        shell: powershell
        run: ./windows/Launcher-Settings.ps1 -SelfTest
